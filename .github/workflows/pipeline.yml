name: Pipeline CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # ==========================================
  # BUILD
  # ==========================================

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Verificar arquivos
        run: |
          test -f index.html
          test -f style.css
          test -f script.js

          echo "Build concluído com sucesso!"


  # ==========================================
  # LINT
  # ==========================================

  lint:
    name: Lint
    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Executar ESLint
        run: npm run lint


  # ==========================================
  # TEST
  # ==========================================

  test:
    name: Testes
    runs-on: ubuntu-latest

    needs: lint

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Executar testes
        run: npm test


  # ==========================================
  # SECURITY
  # ==========================================

  security:
    name: Segurança
    runs-on: ubuntu-latest

    needs: test

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Verificar vulnerabilidades
        run: npm audit --audit-level=high


  # ==========================================
  # DEPLOY DEV
  # ==========================================

  deploy-dev:
    name: Deploy Dev
    runs-on: ubuntu-latest

    needs: security

    steps:

      - name: Deploy em desenvolvimento
        run: |
          echo "Realizando deploy no ambiente DEV..."
          echo "Deploy DEV concluído!"


  # ==========================================
  # SMOKE TEST
  # ==========================================

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest

    needs: deploy-dev

    steps:

      - name: Executar Smoke Test
        run: |
          echo "Verificando aplicação..."
          echo "Aplicação está funcionando!"
          echo "Smoke Test aprovado!"


  # ==========================================
  # HOMOLOGAÇÃO
  # ==========================================

  deploy-homolog:
    name: Deploy Homologação
    runs-on: ubuntu-latest

    needs: smoke-test

    steps:

      - name: Deploy em homologação
        run: |
          echo "Realizando deploy em HOMOLOGAÇÃO..."
          echo "Deploy de homologação concluído!"


  # ==========================================
  # PRODUÇÃO
  # ==========================================

  deploy-prod:
    name: Deploy Produção
    runs-on: ubuntu-latest

    needs: deploy-homolog

    steps:

      - name: Deploy em produção
        run: |
          echo "Realizando deploy em PRODUÇÃO..."
          echo "Aplicação publicada com sucesso!"